{% extends 'base.html' %}

{% block title %}Eliminar Tarea - Gestor de Proyectos{% endblock %}

{% block content %}
<div class="card border-danger shadow">
    <div class="card-body text-center">
        <h2 class="text-danger mb-3"><i class="bi bi-exclamation-triangle"></i> Confirmar Eliminación</h2>
        <p class="lead">¿Estás seguro de que deseas eliminar la tarea <strong>"{{ tarea.titulo }}"</strong>?</p>
        <p class="text-muted">Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash"></i> Sí, eliminar
            </button>
            <a href="{% url 'tareas:proyecto_detail' tarea.proyecto.pk %}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
